name: Deploy API Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UserManagementAPI.csproj

      - name: Build
        run: dotnet build UserManagementAPI.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Tests/Tests.csproj --no-build --configuration Release

      - name: Start API and fetch OpenAPI spec
        run: |
          # Start the API (no AUTH_TOKEN means all protected routes return 401,
          # but /openapi is excluded from auth so the spec is always reachable)
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS=http://localhost:5075 \
          dotnet run --project UserManagementAPI.csproj --configuration Release --no-build &
          APP_PID=$!

          echo "Waiting for API to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:5075/swagger/v1/swagger.json > /dev/null; then
              echo "API is ready."
              break
            fi
            sleep 1
          done

          echo "Fetching OpenAPI spec..."
          curl -sf http://localhost:5075/swagger/v1/swagger.json -o docs/openapi.json

          kill $APP_PID

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
